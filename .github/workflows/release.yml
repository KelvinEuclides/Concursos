name: Release

on:
  # Push a semver tag to cut a release for that version.
  push:
    tags: ['v*.*.*']
  # Or run manually: bumps the last tag, tags, builds and releases.
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write   # create tags + GitHub Releases

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            latest="$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1)"
            latest="${latest:-v0.0.0}"
            IFS=. read -r MA MI PA <<< "${latest#v}"
            case "${{ inputs.bump }}" in
              major) MA=$((MA+1)); MI=0; PA=0 ;;
              minor) MI=$((MI+1)); PA=0 ;;
              *)     PA=$((PA+1)) ;;
            esac
            VERSION="$MA.$MI.$PA"
            TAG="v$VERSION"
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "$TAG"
            git push origin "$TAG"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "KEYSTORE_BASE64 length: ${#KEYSTORE_BASE64}"
          if [ "${#KEYSTORE_BASE64}" -lt 1000 ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing or too short (${#KEYSTORE_BASE64} chars). Re-upload it: base64 -i your-release.jks | gh secret set KEYSTORE_BASE64"
            exit 1
          fi
          mkdir -p keystore
          printf %s "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
          bytes=$(wc -c < keystore/release.jks)
          echo "decoded keystore: $bytes bytes"
          if [ "$bytes" -lt 500 ]; then
            echo "::error::Decoded keystore is only $bytes bytes — the base64 is corrupt."
            exit 1
          fi

      - name: Build signed APK + AAB
        env:
          KEYSTORE_FILE: keystore/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace \
            -PversionName="${{ steps.ver.outputs.version }}" \
            -PversionCode="${{ steps.ver.outputs.code }}"

      - name: Collect artifacts
        run: |
          set -e
          V="${{ steps.ver.outputs.version }}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/concursos-$V.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/concursos-$V.aab"
          ( cd dist && sha256sum * > SHA256SUMS.txt )
          ls -la dist

      - name: Verify APK signature
        run: |
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -n1)
          "$BT/apksigner" verify --print-certs "dist/concursos-${{ steps.ver.outputs.version }}.apk"

      - name: Publish GitHub Release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: |
            dist/concursos-${{ steps.ver.outputs.version }}.apk
            dist/concursos-${{ steps.ver.outputs.version }}.aab
            dist/SHA256SUMS.txt

      - name: Cleanup keystore
        if: always()
        run: rm -f keystore/release.jks
